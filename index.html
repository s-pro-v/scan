<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobilny Skaner OXY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="oxy-mobile-env">
        <header class="panel top-module">
            <div class="corner-bracket top-left"></div>
            <div class="corner-bracket bottom-right"></div>
            <div class="header-content">
                <div class="header-branding">
                    <h1>SYS.SCANNER</h1>
                    <div class="kernel">
                        <span>WEBRTC // MULTI_LENS</span>
                        <div class="zebra-stripe"></div>
                    </div>
                </div>
                <div class="header-controls-group">
                    <button class="sys-btn tool-btn" id="btn-toggle-theme">
                        <span class="btn-text" id="theme-btn-text">☀</span>
                    </button>
                    <button class="sys-btn tool-btn" id="btn-toggle-history">
                        <span class="btn-text">DATA_DB</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="panel viewport-module">
            <div class="corner-bracket top-right"></div>
            <div class="corner-bracket bottom-left"></div>

            <div class="viewport-header">
                <span class="data-label" id="cam-info">SYS // OFFLINE</span>
                <span class="data-label" id="barcode-format">FMT: UNKNOWN</span>
                <span class="tech-coords">RES: <span id="cam-res">0x0</span></span>
            </div>

            <div class="camera-container">
                <video id="live-feed" autoplay playsinline muted></video>
                <canvas id="capture-canvas"></canvas>
                <div class="hud-layer">
                    <div class="crosshairs-center"></div>
                    <div class="scan-line" id="scan-laser"></div>
                </div>
            </div>

            <div class="scanned-field-container">
                <input type="text" id="input-scanned-val" placeholder="OCZEKIWANIE NA SKAN..." readonly>
                <button class="sys-btn tool-btn" id="btn-copy-input">
                    <span class="btn-text">KOPIUJ</span>
                </button>
            </div>
        </main>

        <footer class="panel control-module">
            <div class="corner-bracket top-left"></div>

            <div class="terminal-log" id="event-log"></div>

            <div class="zoom-module" id="zoom-container">
                <div class="zoom-label">
                    <span>OPTICAL_ZOOM</span><span id="zoom-val">1.0x</span>
                </div>
                <input type="range" id="zoom-slider" class="sys-slider" min="1" max="3" step="0.1" value="1">
            </div>

            <div class="hardware-controls">
                <button class="sys-btn tool-btn" id="btn-power">
                    <span class="btn-text">PWR</span>
                    <span class="sub-text">OFFLINE</span>
                </button>
                <button class="sys-btn tool-btn disabled" id="btn-lens-cycle">
                    <span class="btn-text">LENS_SW</span>
                    <span class="sub-text" id="lens-label">SZUKAM...</span>
                </button>
                <button class="sys-btn tool-btn disabled" id="btn-torch">
                    <span class="btn-text">TORCH</span>
                    <span class="sub-text">FLESZ</span>
                </button>
            </div>

            <div class="action-grid">
                <div class="radiator-vent"></div>
                <div class="action-grid-row">
                    <button class="sys-btn massive-btn scan-action disabled" id="btn-scan-code">
                        <span class="btn-text">RĘCZNY</span>
                    </button>
                    <button class="sys-btn massive-btn disabled" id="btn-auto-scan">
                        <span class="btn-text" id="auto-scan-text">AUTO: WYŁ.</span>
                    </button>
                    <button class="sys-btn massive-btn disabled" id="btn-capture">
                        <span class="btn-text">FOTO</span>
                    </button>
                </div>
            </div>
        </footer>

        <!-- History database overlay -->
        <div class="history-overlay" id="history-overlay">
            <div class="history-header">
                <span class="history-title">SYS // ARCHIWUM_SKANOW</span>
                <div class="zebra-stripe"></div>
            </div>
            <div class="history-list" id="history-list">
                <!-- Spans inserted dynamically by JS -->
            </div>

            <div class="slack-integration-panel">
                <div class="slack-panel-header">
                    <span class="slack-integration-title">SLACK INTEGRATION // UPLINK</span>
                </div>
                <div class="slack-input-row">
                    <input type="password" id="slack-webhook-input" placeholder="WPROWADŹ WEBHOOK URL...">
                    <button class="sys-btn tool-btn" id="btn-save-webhook">
                        <span class="btn-text">ZAPISZ</span>
                    </button>
                </div>
                <button class="sys-btn massive-btn slack-btn" id="btn-send-to-slack">
                    <span class="btn-text">WYŚLIJ ARCHIWUM DO SLACK</span>
                </button>
            </div>

            <div class="history-footer">
                <button class="sys-btn tool-btn" id="btn-clear-history">
                    <span class="btn-text">WYCZYŚĆ BAZĘ</span>
                </button>
                <button class="sys-btn tool-btn active-tool" id="btn-close-history">
                    <span class="btn-text">POWRÓT // ZAMKNIJ</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
